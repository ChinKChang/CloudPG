<!DOCTYPE html>
<html>
<head>
  <title>Rock Paper Scissors</title>
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  <form method="post">
    <button name="choice" value="rock">Rock</button>
    <button name="choice" value="paper">Paper</button>
    <button name="choice" value="scissors">Scissors</button>
  </form>

  {% if result %}
    <p>You chose: {{ user }}</p>
    <p>AI chose: {{ ai }}</p>
    <h2>{{ result }}</h2>
  {% endif %}
</body>
</html>
